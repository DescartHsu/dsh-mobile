name: Daily upstream sync

on:
  schedule:
    - cron: '17 1 * * *' # 09:17 Asia/Shanghai
  workflow_dispatch:
    inputs:
      run_checks:
        description: Run integration checks even when there are no upstream updates
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: daily-upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'DescartHsu/dsh-mobile' && github.ref == 'refs/heads/my-custom'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      statuses: write
    outputs:
      head: ${{ steps.sync.outputs.head }}
      base: ${{ steps.sync.outputs.base }}
      check: ${{ steps.sync.outputs.check }}
      pr: ${{ steps.sync.outputs.pr }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: my-custom
          fetch-depth: 0
      - name: Fast-forward main and open a review PR
        id: sync
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_CHECKS: ${{ inputs.run_checks || false }}
        run: bash .github/scripts/upstream-sync.sh

  validate:
    needs: sync
    if: needs.sync.outputs.check == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.sync.outputs.base }}
          fetch-depth: 0
          persist-credentials: false
      - name: Test the exact upstream and custom combination
        env:
          UPSTREAM_SHA: ${{ needs.sync.outputs.head }}
          CUSTOM_SHA: ${{ needs.sync.outputs.base }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch --no-tags origin "$UPSTREAM_SHA"
          printf 'Testing upstream `%s` against custom `%s`.\n' "$UPSTREAM_SHA" "$CUSTOM_SHA" >> "$GITHUB_STEP_SUMMARY"
          if ! git merge --no-commit --no-ff "$UPSTREAM_SHA"; then
            echo '::error::Merge conflict: retain custom changes and resolve in the PR. No remote branch was overwritten.'
            git diff --name-only --diff-filter=U >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - name: Version, docs, types, tests, build and package checks
        run: npm run verify
      - uses: actions/setup-go@v7
        with:
          go-version: 1.26.6
          cache-dependency-path: native/funnel-host/go.sum
      - name: Funnel tests
        working-directory: native/funnel-host
        run: |
          go test ./...
          go vet ./...
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-36'
      - uses: gradle/actions/setup-gradle@v6
      - name: Android lint, unit tests and debug build
        working-directory: apps/mobile/android
        run: bash ./gradlew --no-daemon lintDebug testDebugUnitTest assembleDebug -x lintAnalyzeDebugUnitTest -x lintAnalyzeDebugAndroidTest

  report:
    needs: [sync, validate]
    if: always() && needs.sync.outputs.check == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      statuses: write
    steps:
      - name: Publish integration status without executing project code
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_SHA: ${{ needs.sync.outputs.head }}
          CUSTOM_SHA: ${{ needs.sync.outputs.base }}
          CHECK_RESULT: ${{ needs.validate.result }}
        run: |
          set -euo pipefail
          state=failure
          description='Integration checks failed; inspect workflow logs'
          if [[ "$CHECK_RESULT" == success ]]; then
            current_base=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/my-custom" --jq '.object.sha')
            if [[ "$current_base" == "$CUSTOM_SHA" ]]; then
              state=success
              description="Integration passed against custom ${CUSTOM_SHA:0:12}"
            else
              state=error
              description='Custom branch changed during checks; run workflow again'
            fi
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$UPSTREAM_SHA" \
            -f state="$state" -f context='upstream-sync/integration' \
            -f description="$description" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > /dev/null
          printf '%s\n' "$description" >> "$GITHUB_STEP_SUMMARY"
